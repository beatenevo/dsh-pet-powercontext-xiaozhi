name: Robot MCP package

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: robot-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: dsh-pet
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Apply the version from the selected tag
        run: node scripts/release-metadata.mjs --write
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test and pack the ordinary plugin
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          pnpm test
          pnpm test:robot
          mkdir -p "$RUNNER_TEMP/base-package"
          npm pack --pack-destination "$RUNNER_TEMP/base-package"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-pet-powercontext-plugin-standard-all-platforms
          path: ${{ runner.temp }}/base-package/*.tgz
          retention-days: 7
          if-no-files-found: error
