name: seekdb tracing integration
on:
  pull_request:
    paths:
      - "dsh-pet/runtime/powercontext/**"
      - ".github/workflows/seekdb-tracing.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qualified runtime
        run: python -m pip install -r dsh-pet/runtime/powercontext/requirements.txt
      - name: Verify real SQL and parent continuity
        env:
          DSH_SEEKDB_INTEGRATION: "1"
        run: python -m unittest discover -s dsh-pet/runtime/powercontext -p 'test_*.py' -v
